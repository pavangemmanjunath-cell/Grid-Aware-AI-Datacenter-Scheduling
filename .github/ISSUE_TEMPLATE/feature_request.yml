name: Feature request
description: Propose a new capability for the software.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: What should the software do? API sketches or mock-ups are welcome.
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: A concrete scenario in which you would use it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: justification
    attributes:
      label: Technical / research justification
      description: Why does this belong in this repository? References with DOIs are welcome.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require changing the published reference code or the results in data/.
        - label: I am willing to help implement or test it.
