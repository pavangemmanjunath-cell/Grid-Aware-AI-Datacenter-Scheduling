version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /webapp/backend
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /webapp/frontend
    schedule:
      interval: monthly
    groups:
      three:
        patterns: ["three", "@types/three", "@react-three/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
