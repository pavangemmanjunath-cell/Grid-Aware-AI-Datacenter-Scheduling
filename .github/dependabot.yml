version: 2
# Grouped, monthly updates so a research repository is not flooded with one pull request per package.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /webapp/backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      backend:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /webapp/frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
