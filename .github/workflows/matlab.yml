# Runs the MATLAB reference implementation with the Optimization Toolbox (MILP path) and compares the run
# against the published artefacts. MathWorks provides these actions free of charge for public repositories.
# Manual only (about 5 minutes): this workflow has NOT yet been validated on GitHub.
name: MATLAB reference run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          products: Optimization_Toolbox
      - name: Verification run (does not overwrite data/)
        uses: matlab-actions/run-command@v3
        with:
          command: cd verify; addpath('../matlab'); qh2dc_verify_run('qh2dc_run_actual.txt')
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare with the published reference
        run: python verify/check_run.py
        continue-on-error: true   # QAOA p=2 is optimiser/release dependent; see docs/reproducibility.md
      - uses: actions/upload-artifact@v4
        with:
          name: matlab-run
          path: verify/qh2dc_run_actual.txt
